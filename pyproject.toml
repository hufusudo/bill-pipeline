[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# NiceGUI 的模拟用户测试要用异步测试，入口文件是 main.py
asyncio_mode = "auto"
main_file = "main.py"
filterwarnings = [
    # Streamlit 1.66 画图时内部用了 pandas 3.1 弃用的 reset_index(inplace=True)，不是本项目的代码
    "ignore:The inplace keyword in DataFrame.reset_index is deprecated",
]
